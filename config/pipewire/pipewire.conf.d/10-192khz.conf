monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        audio.format          = "S32LE"
        audio.rate            = 192000
        audio.channels        = 2
        api.alsa.period-size  = 128
        api.alsa.headroom     = 0
      }
    }
  }
]
